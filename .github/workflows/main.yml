name: Build DEB and IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Packaging Tools
        run: |
          brew install ldid dpkg

      - name: Build iOS Scheme with Xcode
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          set -o pipefail
          pod install
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' Pods/Pods.xcodeproj/project.pbxproj

          xcodebuild -workspace ReProvision.xcworkspace \
            -scheme iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ENABLE_BITCODE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            OTHER_CFLAGS='$(inherited) -Wno-error=implicit-function-declaration -Wno-error=incompatible-function-pointer-types -Wno-error=int-conversion' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build_out" > xcodebuild.log 2>&1 || {
              echo "=== 50 BARIS TERAKHIR LOG XCODE ==="
              tail -n 50 xcodebuild.log
              exit 1
            }

      - name: Sign & Package IPA and DEB
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          mkdir -p dist Payload
          APP_PATH=$(find build_out -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "File .app tidak ditemukan di build_out"
            exit 1
          fi

          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          ENT_FILE=$(find . -maxdepth 4 \( -name "*.entitlements" -o -name "*entitlements*.plist" \) | grep -i "iOS" | head -n 1)
          if [ -z "$ENT_FILE" ]; then
            ENT_FILE=$(find . -maxdepth 4 \( -name "*.entitlements" -o -name "*entitlements*.plist" \) | head -n 1)
          fi

          if [ -n "$ENT_FILE" ]; then
            ldid -S"$ENT_FILE" "$APP_PATH/$EXEC_NAME" || ldid -S "$APP_PATH/$EXEC_NAME"
          else
            ldid -S "$APP_PATH/$EXEC_NAME"
          fi

          # 1. Buat .ipa (untuk TrollStore)
          cp -r "$APP_PATH" Payload/
          zip -qr dist/ReProvision-Reborn-Again.ipa Payload

          # Siapkan file control
          CONTROL_FILE=$(find . -maxdepth 3 -name "control" | head -n 1)
          mkdir -m 0755 -p deb_rootless/DEBIAN deb_rootless/var/jb/Applications
          mkdir -m 0755 -p deb_rootful/DEBIAN deb_rootful/Applications

          if [ -n "$CONTROL_FILE" ]; then
            cp "$CONTROL_FILE" deb_rootless/DEBIAN/control
            cp "$CONTROL_FILE" deb_rootful/DEBIAN/control
          else
            printf "Package: com.matchstic.reprovision.reborn\nName: ReProvision Reborn\nVersion: 0.8.5\nArchitecture: iphoneos-arm64\nDescription: Re-sign applications on device\nMaintainer: bb91z\nAuthor: Matt Clarke\nSection: System\n" > deb_rootless/DEBIAN/control
            cp deb_rootless/DEBIAN/control deb_rootful/DEBIAN/control
          fi

          # 2. Buat .deb Rootless (iOS 15-16+ / Dopamine / Palera1n)
          cp -r "$APP_PATH" deb_rootless/var/jb/Applications/
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64/' deb_rootless/DEBIAN/control
          chmod 0644 deb_rootless/DEBIAN/control
          dpkg-deb -Zgzip -b deb_rootless dist/ReProvision-Reborn-Again_rootless.deb

          # 3. Buat .deb Rootful (iOS 14 ke bawah)
          cp -r "$APP_PATH" deb_rootful/Applications/
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm/' deb_rootful/DEBIAN/control
          chmod 0644 deb_rootful/DEBIAN/control
          dpkg-deb -Zgzip -b deb_rootful dist/ReProvision-Reborn-Again_rootful.deb

      - name: Upload Output Files
        uses: actions/upload-artifact@v4
        with:
          name: ReProvision-Reborn-Output
          path: dist/*
