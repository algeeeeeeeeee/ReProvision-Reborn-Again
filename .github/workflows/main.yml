name: Build DEB
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos & Dependencies
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git ~/theos
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p ~/theos/sdks
          mv /tmp/sdks/*.sdk ~/theos/sdks/

      - name: Build Package
        env:
          THEOS: /Users/runner/theos
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ReProvision-Reborn-deb
          path: packages/*.deb
