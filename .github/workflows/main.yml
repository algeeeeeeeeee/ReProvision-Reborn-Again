name: Build DEB and IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Packaging Tools
        run: |
          brew install ldid dpkg
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /opt/homebrew/bin/ldid /usr/local/bin/ldid
          sudo ln -sf /opt/homebrew/bin/dpkg-deb /usr/local/bin/dpkg-deb

      - name: Build iOS Scheme with Xcode
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          set -o pipefail
          pod install
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' Pods/Pods.xcodeproj/project.pbxproj

          python3 -c '
          import re
          p = "ReProvision.xcodeproj/project.pbxproj"
          s = open(p).read()
          def fix(m):
              return re.sub(r"(shellScript = \")([^\"]*)(\";)", lambda sm: sm.group(1) + sm.group(2) + "\\nexit 0\\n" + sm.group(3), m.group(0))
          s = re.sub(r"C996746A20EE32D500EEFBD2 /\* Move daemon binary into Package \*/ = \{.*?\};", fix, s, flags=re.S)
          open(p, "w").write(s)
          '

          xcodebuild -workspace ReProvision.xcworkspace \
            -scheme iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ENABLE_BITCODE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            OTHER_CFLAGS='$(inherited) -Wno-error=implicit-function-declaration -Wno-error=incompatible-function-pointer-types -Wno-error=int-conversion' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign & Package IPA and DEB
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          mkdir -p dist Payload

          DERIVED="$HOME/Library/Developer/Xcode/DerivedData"
          APP_PATH=$(find "$DERIVED" -path "*/Build/Products/Release-iphoneos/*.app" | head -n 1)
          DAEMON_PATH=$(find "$DERIVED" -path "*/Build/Products/Release-iphoneos/reprovisiond" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "File .app tidak ditemukan di DerivedData"
            exit 1
          fi

          if [ -n "$DAEMON_PATH" ] && [ -f "$DAEMON_PATH" ]; then
            cp "$DAEMON_PATH" "$APP_PATH/reprovisiond"
            chmod 0755 "$APP_PATH/reprovisiond"
          fi

          APP_ENT=$(find iOS Shared -maxdepth 3 \( -name "*.entitlements" -o -name "*entitlements*.plist" \) 2>/dev/null | grep -viE "daemon|extension|share|mac|tv" | head -n 1)
          if [ -n "$APP_ENT" ]; then
            sed -e 's/\$(AppIdentifierPrefix)//g' -e 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.matchstic.ReProvision/g' "$APP_ENT" > /tmp/app.ent
            ldid -S/tmp/app.ent "$APP_PATH/ReProvision" || ldid -S "$APP_PATH/ReProvision"
          else
            ldid -S "$APP_PATH/ReProvision"
          fi

          if [ -f "$APP_PATH/reprovisiond" ]; then
            DAEMON_ENT=$(find . -maxdepth 4 \( -name "*.entitlements" -o -name "*entitlements*.plist" \) 2>/dev/null | grep -i "daemon" | grep -vi "tv" | head -n 1)
            if [ -n "$DAEMON_ENT" ]; then
              sed -e 's/\$(AppIdentifierPrefix)//g' -e 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.matchstic.reprovisiond/g' "$DAEMON_ENT" > /tmp/daemon.ent
              ldid -S/tmp/daemon.ent "$APP_PATH/reprovisiond" || ldid -S "$APP_PATH/reprovisiond"
            else
              ldid -S "$APP_PATH/reprovisiond"
            fi
          fi

          for APPEX in "$APP_PATH"/PlugIns/*.appex; do
            if [ -d "$APPEX" ]; then
              EXT_BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APPEX/Info.plist")
              ldid -S "$APPEX/$EXT_BIN" || true
            fi
          done

          # 1. Buat .ipa (untuk TrollStore)
          cp -r "$APP_PATH" Payload/
          zip -qr dist/ReProvision-Reborn-Again.ipa Payload

          # Siapkan folder paket .deb
          mkdir -m 0755 -p deb_rootless/DEBIAN deb_rootless/var/jb/Applications
          mkdir -m 0755 -p deb_rootful/DEBIAN deb_rootful/Applications

          CONTROL_FILE=$(find . -maxdepth 3 -name "control" | head -n 1)
          if [ -n "$CONTROL_FILE" ]; then
            cp "$CONTROL_FILE" deb_rootless/DEBIAN/control
            cp "$CONTROL_FILE" deb_rootful/DEBIAN/control
          else
            printf "Package: com.matchstic.reprovision.reborn\nName: ReProvision Reborn\nVersion: 0.8.5\nArchitecture: iphoneos-arm64\nDescription: Re-sign applications on device\nMaintainer: bb91z\nAuthor: Matt Clarke\nSection: System\n" > deb_rootless/DEBIAN/control
            cp deb_rootless/DEBIAN/control deb_rootful/DEBIAN/control
          fi

          PLIST_FILE=$(find . -maxdepth 4 -name "*reprovisiond*.plist" | grep -viE "Info|entitlements" | head -n 1)
          if [ -n "$PLIST_FILE" ]; then
            mkdir -m 0755 -p deb_rootless/var/jb/Library/LaunchDaemons deb_rootful/Library/LaunchDaemons
            sed 's|/Applications/ReProvision.app|/var/jb/Applications/ReProvision.app|g' "$PLIST_FILE" > deb_rootless/var/jb/Library/LaunchDaemons/$(basename "$PLIST_FILE")
            cp "$PLIST_FILE" deb_rootful/Library/LaunchDaemons/
          fi

          # 2. Buat .deb Rootless (iOS 15-16+ / Dopamine / Palera1n)
          cp -r "$APP_PATH" deb_rootless/var/jb/Applications/
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64/' deb_rootless/DEBIAN/control
          chmod 0644 deb_rootless/DEBIAN/control
          dpkg-deb -Zgzip -b deb_rootless dist/ReProvision-Reborn-Again_rootless.deb

          # 3. Buat .deb Rootful (iOS 14 ke bawah)
          cp -r "$APP_PATH" deb_rootful/Applications/
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm/' deb_rootful/DEBIAN/control
          chmod 0644 deb_rootful/DEBIAN/control
          dpkg-deb -Zgzip -b deb_rootful dist/ReProvision-Reborn-Again_rootless.deb

      - name: Upload Output Files
        uses: actions/upload-artifact@v4
        with:
          name: ReProvision-Reborn-Output
          path: dist/*
